name: 챔피언 랭킹 자동 갱신

# 라이엇 API로 경기를 모아 통계를 계산하고, 결과를 data 브랜치에 저장합니다.
# data 브랜치는 매번 덮어써서 기록이 쌓이지 않습니다. (저장소 용량이 늘지 않음)
# 끝나면 "사이트 배포" 워크플로가 자동으로 이어서 실행됩니다.

on:
  schedule:
    - cron: "17 2,10,18 * * *"   # 매일 한국 시간 3:17, 11:17, 19:17 (8시간마다, 하루 3번)
  workflow_dispatch:              # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: data 브랜치에서 지난 집계 가져오기
        run: |
          mkdir -p databranch
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            git --work-tree=databranch checkout FETCH_HEAD -- .
            echo "data 브랜치에서 이어서 집계합니다."
          else
            # 처음 한 번: 예전 방식(main 에 저장)으로 모아둔 데이터를 옮겨옴
            [ -e data/ranking_state.json ] && cp data/ranking_state.json databranch/
            [ -e ranking_data.js ] && cp ranking_data.js databranch/
            [ -e champ_data.js ] && cp champ_data.js databranch/
            echo "data 브랜치가 없어서 새로 만듭니다."
          fi
          git reset -q

      - name: 랭킹 계산
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          MAX_RUNTIME_MIN: "110"
          DATA_DIR: ${{ github.workspace }}/databranch
        run: python scripts/update_ranking.py

      - name: data 브랜치에 저장 (기록 없이 덮어쓰기)
        run: |
          cd databranch
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b data
          git add -A
          git commit -q -m "통계 데이터 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: main 에 남아 있는 예전 데이터 파일 정리 (처음 한 번만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
          removed=0
          for f in ranking_data.js champ_data.js data/ranking_state.json; do
            if git ls-files --error-unmatch "$f" > /dev/null 2>&1; then git rm -q "$f"; removed=1; fi
          done
          if [ "$removed" = 1 ]; then
            git commit -q -m "데이터 파일을 data 브랜치로 이동"
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
          fi
