name: 사이트 배포

# main 브랜치의 사이트 코드 + data 브랜치의 최신 통계 파일을 합쳐서 GitHub Pages 에 올립니다.
# (저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 바꿔야 합니다)

on:
  push:
    branches: [main]                       # index.html 등을 고치면 바로 배포
  workflow_run:
    workflows: ["챔피언 랭킹 자동 갱신"]     # 통계 갱신이 끝나면 배포
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 사이트 코드 가져오기 (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: 최신 통계 파일 합치기 (data)
        run: |
          cd site
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            for f in ranking_data.js champ_data.js; do
              git show "FETCH_HEAD:$f" > "$f" 2>/dev/null || rm -f "$f"
            done
          fi
          rm -rf .git .github scripts data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
