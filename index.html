<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="로딩 창 30초 안에 확인하는 맞춤형 롤 라인전 매치업 솔루션">
    <title>MVP LOL - 로딩 창 30초 맞춤형 라인전 솔루션</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <!-- 로고 글자 폰트 (Cinzel) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap">
    <!-- 디자인(Tailwind)은 배포할 때 미리 만든 tw.css 파일로 (외부 실행 파일을 불러오지 않음) -->
    <link rel="stylesheet" href="tw.css">
    <style>
        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b2845 0%, #0d111a 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hextech-card {
            background: rgba(16, 24, 40, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.08);
            cursor: pointer;
            transition: all 0.25s ease;
            height: 105px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hextech-card:hover {
            border-color: rgba(212, 175, 55, 0.8);
            background: rgba(22, 33, 56, 0.85);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(212, 175, 55, 0.15);
        }

        .hextech-card:focus-visible,
        button:focus-visible {
            outline: 3px solid #fde047;
            outline-offset: 2px;
        }

        .hextech-hero-card {
            background: rgba(16, 24, 40, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5), inset 0 0 25px rgba(212, 175, 55, 0.15);
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border-radius: 1.5rem;
        }

        .search-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .modal-overlay {
            background-color: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
        }

        .modal-body {
            animation: modalSlide 0.25s ease-out forwards;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* 데이터가 들어가는 양옆 카드: 높이 자동 */
        /* 양옆 카드: 내용만큼 높이 (원래 크기 유지) */
        .hextech-card.side-card {
            height: auto;
            min-height: 105px;
            justify-content: flex-start;
            cursor: pointer;
        }
        /* 빌드 카드만 다른 카드(인기 구도) 높이에 맞춰 자름. 실제 높이는 스크립트가 맞춰줌 */
        #card-build { height: 285px; position: relative; }
        #card-build:focus-within { z-index: 30; }

        /* 사이트 분위기에 맞춘 금색 스크롤바 */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(212, 175, 55, 0.65) rgba(15, 23, 42, 0.4);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-button { display: none; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); border-radius: 999px; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #fde68a 0%, #d4af37 45%, #92400e 100%);
            border-radius: 999px;
            box-shadow: 0 0 6px rgba(250, 204, 21, 0.35);
        }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #fef3c7 0%, #facc15 50%, #b45309 100%); }
        ::-webkit-scrollbar-corner { background: transparent; }
        .side-chip { cursor: pointer; transition: all 0.15s ease; }
        .side-chip:hover { border-color: rgba(250, 204, 21, 0.8); background: rgba(250, 204, 21, 0.12); }
        .side-tab { cursor: pointer; }
        .side-tab.active { background: #f59e0b; color: #020617; }

        /* 메타 소식 흐르는 띠 */
        .meta-ticker {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: linear-gradient(90deg, rgba(120, 53, 15, 0.25), rgba(15, 23, 42, 0.6) 20%, rgba(15, 23, 42, 0.6) 80%, rgba(120, 53, 15, 0.25));
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
                    mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
        }
        .meta-ticker-track {
            display: inline-flex;
            white-space: nowrap;
            animation: ticker-move var(--ticker-duration, 45s) linear infinite;
        }
        .meta-ticker:hover .meta-ticker-track { animation-play-state: paused; }
        @keyframes ticker-move {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        @media (prefers-reduced-motion: reduce) {
            .meta-ticker-track { animation: none; }
        }

        /* 페이지 전체 배경: 오늘의 OP 챔피언 일러스트 */
        .page-splash {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center 20%;
            opacity: 0;
            transform: scale(1.05);
            transition: opacity 1.5s ease, transform 10s ease-out;
            pointer-events: none;
        }
        .page-splash.loaded { opacity: 0.5; transform: scale(1); }
        .page-splash-shade {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(ellipse at center, rgba(13, 17, 26, 0.15) 0%, rgba(13, 17, 26, 0.6) 75%, rgba(13, 17, 26, 0.85) 100%),
                linear-gradient(180deg, rgba(13, 17, 26, 0.4) 0%, rgba(13, 17, 26, 0.05) 40%, rgba(13, 17, 26, 0.75) 100%);
        }

        /* 라인 아이콘 (탑/정글/미드/원딜/서폿) */
        .lane-icon { width: 14px; height: 14px; object-fit: contain; flex-shrink: 0; opacity: 0.9; }
        .lane-decorated { display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
        .side-tab.active .lane-icon, .bg-amber-500 > .lane-icon { filter: brightness(0); opacity: 0.75; }

        body.reduce-motion .meta-ticker-track { animation: none; }
        body.reduce-motion .page-splash { transition: none; }
        body.reduce-motion .hextech-card, body.reduce-motion .side-chip { transition: none; }

        /* 검색창: 카드와 같은 어두운 유리 스타일 */
        .glass-input {
            background: rgba(15, 23, 42, 0.72) !important;
            color: #f8fafc !important;
            border: 1.5px solid rgba(212, 175, 55, 0.55) !important;
            box-shadow: inset 0 0 18px rgba(56, 189, 248, 0.06), 0 6px 24px rgba(0, 0, 0, 0.35) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .glass-input::placeholder { color: rgba(203, 213, 225, 0.5) !important; font-weight: 400; }
        .glass-input:hover { border-color: rgba(250, 204, 21, 0.75) !important; }
        .glass-input:focus {
            background: rgba(15, 23, 42, 0.88) !important;
            border-color: #facc15 !important;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.18), 0 0 22px rgba(250, 204, 21, 0.25), inset 0 0 18px rgba(56, 189, 248, 0.06) !important;
            --tw-ring-shadow: 0 0 #0000 !important;
        }

        /* 로고 카드 양옆 마법공학 장식: 빛나는 금색 호 + 눈금 링 */
        .hex-ornament {
            position: absolute;
            top: 0;
            height: 100%;
            width: auto;
            pointer-events: none;
            z-index: 5;
        }
        .hex-ornament.left { left: 5px; }
        .hex-ornament.right { right: 5px; transform: scaleX(-1); }
        .hex-ornament .hex-frame {
            filter: drop-shadow(0 0 2px rgba(200, 170, 110, 0.45));
            animation: hex-arc-glow 5s ease-in-out infinite;
        }
        /* 로고와 문구 사이 금색 구분선 (가운데 꺾쇠 + 양끝 마름모) */
        .hex-divider { display: flex; align-items: center; justify-content: center; width: min(78%, 460px); margin: 10px auto 2px; }
        .hex-divider .line { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(200, 170, 110, 0), rgba(200, 170, 110, 0.9)); }
        .hex-divider .line.r { background: linear-gradient(90deg, rgba(200, 170, 110, 0.9), rgba(200, 170, 110, 0)); }
        .hex-divider .dot { width: 6px; height: 6px; border: 1px solid #C8AA6E; transform: rotate(45deg); flex-shrink: 0; }
        .hex-divider svg { width: 34px; height: 14px; flex-shrink: 0; margin: 0 2px; filter: drop-shadow(0 0 2px rgba(200, 170, 110, 0.6)); }
        @keyframes hex-arc-glow {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; }
        }
        @media (max-width: 640px) { .hex-ornament { height: 78%; top: 11%; } }
        body.reduce-motion .hex-ornament .hex-frame { animation: none; }
        .hex-ornament .hex-ring {
            transform-box: view-box;
            transform-origin: 308.6px 199px;
            animation: hex-ring-spin 90s linear infinite;
        }
        /* 오른쪽은 거울로 뒤집혀 있어서 반대로 돌려야 화면에서 둘 다 시계방향 */
        .hex-ornament.right .hex-ring { animation-direction: reverse; }
        @keyframes hex-ring-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        body.reduce-motion .hex-ornament .hex-ring { animation: none; }
        /* 빌드 상세 카드(코어·룬) 양옆 작은 마법공학 테두리: 고정 크기, 글자·아이콘과 안 겹치게 안쪽 여백 확보 */
        .hex-box { position: relative; overflow: hidden; padding-left: 2.6rem !important; padding-right: 2.6rem !important; }
        /* 테두리 들어간 룬 칸: 핵심 룬 4개가 한 줄에 들어가게 살짝 작게 */
        .hex-box .rune-key { width: 2.5rem !important; height: 2.5rem !important; }
        .hex-box .rune-row { gap: 0.375rem !important; }
        .hex-box > *:not(.box-ornament) { position: relative; z-index: 1; }
        /* 매치업 상세에서는 '메인으로 돌아가기' 대신 검색창이 맨 위에 */
        #detail-view:has(#detail-search-form) #back-bar { display: none; }
        /* 마법공학 테두리 ver.3 (나만의 상점 선): 위쪽 가운데 홈 + 양옆·아래 이중선 */
        .v3-box { position: relative; padding: 1.75rem 1.1rem 1.1rem !important; }
        .v3-box > .shop-frame { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; }
        .v3-box > *:not(.shop-frame) { position: relative; z-index: 1; }
        .vs-card > *:not(.hex-ornament) { position: relative; z-index: 1; }
        .box-ornament { position: absolute; top: 8px; bottom: 8px; width: 53px; display: flex; flex-direction: column; pointer-events: none; z-index: 0; opacity: 0.9; }
        .box-ornament.left { left: 0; transform: translateX(-30%); }
        .box-ornament.right { right: 0; transform: translateX(30%) scaleX(-1); }
        .box-orn-piece { display: block; width: 100%; overflow: hidden; }
        .box-orn-t, .box-orn-b { flex: 1 1 0; min-height: 0; }
        .box-orn-m { flex: 0 0 auto; height: 43px; }
        .box-orn-piece path, .box-orn-piece circle { vector-effect: non-scaling-stroke; }
        .box-orn-piece .hex-frame { filter: drop-shadow(0 0 2px rgba(200, 170, 110, 0.45)); animation: hex-arc-glow 5s ease-in-out infinite; }
        .box-orn-piece path, .box-orn-piece circle { stroke-width: 1px; }
        .box-orn-piece .hex-ring path { stroke-width: 0.8px; }
        .box-orn-piece .hex-ring { transform-box: view-box; animation: hex-ring-spin 90s linear infinite; }
        /* 회전 중심(308.6, 199)을 조각별 viewBox 시작점 기준으로 */
        .box-orn-t .hex-ring { transform-origin: 308.6px 199px; }
        .box-orn-m .hex-ring { transform-origin: 308.6px 57px; }
        .box-orn-b .hex-ring { transform-origin: 308.6px -57px; }
        .box-ornament.right .hex-ring { animation-direction: reverse; }
        body.reduce-motion .box-orn-piece .hex-ring, body.reduce-motion .box-orn-piece .hex-frame { animation: none; }

        /* MVP LOL 로고 글자 */
        .logo-font, .logo-font * { font-family: 'Cinzel', 'Pretendard', serif !important; font-weight: 900 !important; letter-spacing: 0.02em; }
        /* 로고 글자: 금속 금색 줄무늬 그라데이션 (테두리 없이, 그림자 하나) */
        .logo-font > span {
            background: linear-gradient(180deg, #fff3c9 0%, #f0d38a 22%, #c99a45 48%, #8d6224 52%, #d9b062 70%, #f7e2a6 86%, #9a6d2c 100%);
            -webkit-background-clip: text; background-clip: text;
            color: transparent !important;
            -webkit-text-stroke: 0;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7)) !important;
        }
        #brand-logo > span { filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.7)) !important; }
        /* MVP / LOL 글자를 엠블럼 기준 위아래 정확히 가운데로 (실제 글자 높이를 재서 JS로 보정) */
        /* 엠블럼 그림 자체가 아래쪽에 무게가 있어서 글자를 살짝 내려 눈으로 보기에 가운데로 (더 내리려면 숫자 키우기) */
        .logo-font { --logo-nudge: 0.07em; }
        .logo-font > span {
            display: block;
            line-height: 1;
            transform: translateY(calc(var(--cap-shift, 0px) + var(--logo-nudge)));
        }
        /* ───── 롤 클라이언트 톤 (theme-lol): 쨍한 주황 → 차분한 금색, 골라진 탭은 어두운 바탕 + 금테 ───── */
        body.theme-lol { --lol-gold: #C8AA6E; --lol-gold-hi: #E5CC8E; --lol-gold-d: #785A28; --lol-cream: #F0E6D2; --lol-teal: #0AC8B9; }
        /* 골라진 탭·주황 버튼 */
        body.theme-lol .side-tab.active,
        body.theme-lol button.bg-amber-500, body.theme-lol button.bg-amber-400,
        body.theme-lol a.bg-amber-500 {
            background: linear-gradient(180deg, #1e2a33 0%, #0a1621 100%) !important;
            color: var(--lol-cream) !important;
            box-shadow: inset 0 0 0 1px var(--lol-gold), inset 0 0 12px rgba(200, 170, 110, 0.22), 0 0 10px rgba(200, 170, 110, 0.22) !important;
            text-shadow: 0 0 6px rgba(240, 230, 210, 0.25);
        }
        body.theme-lol .side-tab.active:hover,
        body.theme-lol button.bg-amber-500:hover, body.theme-lol button.bg-amber-400:hover,
        body.theme-lol a.bg-amber-500:hover {
            box-shadow: inset 0 0 0 1px var(--lol-cream), inset 0 0 14px rgba(240, 230, 210, 0.25), 0 0 14px rgba(200, 170, 110, 0.4) !important;
        }
        body.theme-lol .side-tab.active .lane-icon, body.theme-lol .bg-amber-500 > .lane-icon { filter: none; opacity: 1; }
        /* 안 골라진 탭: 살짝 금빛 테두리만 */
        body.theme-lol .side-tab:not(.active), body.theme-lol button.bg-slate-800:is([data-line], [data-cs-line], [data-hot-line], [data-lane-icon]) { box-shadow: inset 0 0 0 1px rgba(120, 90, 40, 0.45); }
        body.theme-lol .side-tab:not(.active):hover, body.theme-lol button.bg-slate-800:is([data-line], [data-cs-line], [data-hot-line], [data-lane-icon]):hover { box-shadow: inset 0 0 0 1px rgba(200, 170, 110, 0.7); }
        /* 글자색: 노랑·주황 → 금색 (로고는 그대로) */
        body.theme-lol .text-yellow-400:not(.logo-font *), body.theme-lol .text-amber-400, body.theme-lol .text-amber-500 { color: var(--lol-gold) !important; }
        body.theme-lol .text-yellow-300, body.theme-lol .text-amber-300 { color: var(--lol-gold-hi) !important; }
        body.theme-lol .text-amber-200, body.theme-lol .text-amber-100 { color: var(--lol-cream) !important; }
        /* 테두리: 주황빛 → 금색 */
        body.theme-lol :is([class^="border-amber-"], [class*=" border-amber-"]) { border-color: rgba(200, 170, 110, 0.38) !important; }
        body.theme-lol :is([class^="border-amber-400"], [class*=" border-amber-400"]) { border-color: rgba(200, 170, 110, 0.7) !important; }
        body.theme-lol .focus\:ring-yellow-400:focus, body.theme-lol .ring-amber-400 { --tw-ring-color: rgba(200, 170, 110, 0.55) !important; }
        body.theme-lol :is([class^="bg-amber-500/"], [class*=" bg-amber-500/"]) { background-color: rgba(200, 170, 110, 0.12) !important; }
    </style>
</head>
<body class="theme-lol flex flex-col justify-between min-h-screen px-4 py-6 md:px-8">
    <!-- 페이지 배경: 오늘의 OP 챔피언 일러스트 (어둡게 깔림) -->
    <div id="hero-splash" class="page-splash" aria-hidden="true"></div>
    <div id="page-splash-shade" class="page-splash-shade" aria-hidden="true"></div>

    <!-- 페이지 양옆 마법공학 테두리 ver.2 (위아래로 늘려 메인 화면을 감쌈, JS로 채움) -->

    <!-- Header Section -->
    <header class="w-full max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 pb-4 border-b border-amber-500/30">
        <a href="#" id="brand-logo" class="logo-font text-2xl sm:text-3xl font-black text-white hover:opacity-95 transition-opacity cursor-pointer flex items-center justify-center gap-2">
            <span class="leading-none">MVP</span>
            <img src="image/5level.webp" alt="명예 5렙 상자" class="w-8 h-8 object-contain drop-shadow-[0_0_8px_rgba(250,204,21,0.7)] flex-shrink-0 -ml-1.5">
            <span class="text-yellow-400 leading-none">LOL</span>
        </a>

        <nav class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 text-base sm:text-lg font-bold" aria-label="주요 메뉴">
            <button type="button" data-page="bug" class="px-4 py-2.5 rounded-xl text-white/95 hover:text-white hover:bg-amber-500/20 border border-amber-500/20 hover:border-amber-500/50 transition-all flex items-center gap-2 cursor-pointer shadow">
                버그 문의

        function getSpellNames(spellText) {
            const names = ['점멸', '점화', '순간이동', '텔레포트', '회복', '정화', '강타', '탈진', '보호막', '유체화'];
            const text = String(spellText || '');
            const found = names
                .map(n =>({ n, i: text.indexOf(n) }))
                .filter(o =>o.i !== -1)
                .sort((a, b) =>a.i - b.i)
                .map(o =>(o.n === '텔레포트' ? '순간이동' : o.n));
            const unique = [...new Set(found)].slice(0, 2);
            return unique.length ? unique : ['점멸', '점화'];
        }

        // 템트리 문장에서 처음 나오는 아이템 이름을 찾아 번호로 바꿔줌 (맨 앞에 숫자가 있으면 그 번호 사용)
        function getItemIdFromText(itemText) {
            const text = String(itemText || '');
            const num = text.match(/^\d+/);
            if (num) return num[0];
            let best = null;
            for (const [name, id] of Object.entries(itemNameToId)) {
                const i = text.indexOf(name);
                if (i === -1) continue;
                if (!best || i < best.i || (i === best.i && name.length >best.name.length)) {
                    best = { i, name, id };
                }
            }
            return best ? best.id : '3152';
        }

        function getValidChampName(input) {
            const clean = input.trim().replace(/\s+/g, '');

        const MATCHUP_DATABASE = {

        function parseMatchup(raw) {
            let text = raw.trim().replace(/\s+/g, ' ');
            if (!text) return null;

            let parts = text.split(/\s*vs\.?\s*|\s+versus\s+|\s*[,/:]\s*|\s+대\s+/i)
                .map(s =>s.trim())
                .filter(Boolean);

            if (parts.length === 2) {
                let m = getValidChampName(parts[0]);
                let o = getValidChampName(parts[1]);
                if (m && o) return { mine: m, opp: o };
            }

            let words = text.split(' ');
            if (words.length >= 2) {
                for (let i = 1; i < words.length; i++) {
                    let part1 = words.slice(0, i).join(' ');
                    let part2 = words.slice(i).join(' ');
                    let m = getValidChampName(part1);
                    let o = getValidChampName(part2);
                    if (m && o) return { mine: m, opp: o };
                }
            }
            return null;
        }

        function parseBottom4Matchup(raw) {
            let text = raw.trim().replace(/\s+/g, ' ');
            if (!text) return null;

            let tokens = text.split(/\s*vs\.?\s*|\s*[,/]\s*|\s+/i)
                .map(s =>s.trim())
                .filter(Boolean);

            if (tokens.length >= 4) {
                let c1 = getValidChampName(tokens[0]);
                let c2 = getValidChampName(tokens[1]);
                let c3 = getValidChampName(tokens[2]);
                let c4 = getValidChampName(tokens[3]);
                if (c1 && c2 && c3 && c4) {
                    return { myAdc: c1, mySup: c2, oppAdc: c3, oppSup: c4 };
                }
            }
            return null;
        }

        function setupUniversalAutocomplete(inputEl, suggestionsEl, onSelectCallback) {
            inputEl.addEventListener('input', (e) => {
                const query = e.target.value.trim().toLowerCase();
                if (!query) { suggestionsEl.classList.add('hidden'); suggestionsEl.innerHTML = ''; return; }

                let matches = [];
                const seen = new Set();
                Object.entries(champAliases).forEach(([alias, official]) => {
                    if (alias.toLowerCase().includes(query) || official.toLowerCase().includes(query)) {
                        if (!seen.has(official)) { seen.add(official); matches.push({ display: `${alias} (${official})`, name: official }); }
                    }
                });
                Object.values(normalizedChampMap).forEach(official => {
                    if (official.toLowerCase().includes(query) && !seen.has(official)) {
                        seen.add(official); matches.push({ display: official, name: official });
                    }
                });
                matches = matches.slice(0, 6);
                if (matches.length === 0) { suggestionsEl.classList.add('hidden'); suggestionsEl.innerHTML = ''; return; }

                suggestionsEl.innerHTML = matches.map(item => `
                    <div class="flex items-center justify-between p-2.5 hover:bg-slate-900 rounded-xl transition-all border border-transparent hover:border-amber-500/40 cursor-pointer suggestion-item" data-name="${item.name}">

                        </div>
                        <span class="text-xs text-amber-400 font-bold">선택하기 ➔</span>

                `).join('');
                suggestionsEl.classList.remove('hidden');

                        const selectedName = el.dataset.name;
                        suggestionsEl.classList.add('hidden');
                        inputEl.value = '';
                        onSelectCallback(selectedName);
                    });
                });
            });
        }

        // 상세페이지 검색창: 메인 검색창 기능 전부 (가렌 아트 / 가렌 vs 아트 / 바텀 4명 / 미리보기에서 MY·ENEMY 바로 교체)

            Object.entries(champAliases).forEach(([alias, official]) => {

            });
            Object.values(normalizedChampMap).forEach(official => {
                if (official.toLowerCase().includes(query) && !seen.has(official)) {
                    seen.add(official); matches.push({ display: official, name: official });
                }
            });
            return matches.slice(0, 6);

        // 롤 클라이언트 '나만의 상점' 장식선 테두리: 위쪽만 가운데 홈, 양옆·아래는 이중 직선
        function shopFrameSVG(w, h) {
          const cx = w / 2;
          const L = Math.max(60, Math.min(260, w * 0.2));     // 가운데 낮은 구간 반 길이
          const D = 14, G = 6;                                // 홈 깊이, 금색선 안쪽 간격
          const X1 = cx - L, X2 = cx + L;
          const edge = (y0, s) => {                           // s=1 위쪽, s=-1 아래쪽 (위아래 뒤집기)
            const Y = v => y0 + s * v;
            const thin = `M0 ${Y(0)} H${X1 - D} L${X1} ${Y(D)} H${cx - 6} L${cx} ${Y(D + 6)} L${cx + 6} ${Y(D)} H${X2} L${X2 + D} ${Y(0)} H${w}`;
            const gold = `M${G} ${Y(G)} H${X1 + 3} L${X1 + 13} ${Y(D)} M${X2 - 13} ${Y(D)} L${X2 - 3} ${Y(G)} H${w - G}`;
            return { thin, gold };
          };
          const t = edge(0, 1);
          return `<svg class="shop-frame" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" aria-hidden="true" style="overflow:visible">
            <g stroke="#8a6d3b" stroke-width="1" stroke-linejoin="miter">
              <path d="${t.thin}"/><path d="M0 ${h} H${w}"/>
              <path d="M0 0 V${h}"/><path d="M${w} 0 V${h}"/>
            </g>
            <g stroke="#c8aa6e" stroke-width="2" stroke-linejoin="miter">
              <path d="${t.gold}"/><path d="M${G} ${h - G} H${w - G}"/>
              <path d="M${G} ${G} V${h - G}"/><path d="M${w - G} ${G} V${h - G}"/>
            </g>
          </svg>`;
        }

        // .v3-box 카드에 마법공학 테두리 ver.3을 씌우고, 카드 크기가 바뀌면 다시 그림
        const v3Resize = ('ResizeObserver' in window) ? new ResizeObserver(entries => entries.forEach(e => drawV3(e.target))) : null;
        function drawV3(box) {
            const w = Math.round(box.offsetWidth), h = Math.round(box.offsetHeight);
            if (!w || !h) return;
            const old = box.querySelector(':scope > .shop-frame');
            if (old && old.dataset.size === w + 'x' + h) return;
            if (old) old.remove();
            box.insertAdjacentHTML('afterbegin', shopFrameSVG(w, h).replace('<svg class="shop-frame"', `<svg class="shop-frame" data-size="${w}x${h}"`));
        }
        function decorateV3(root = document) {
            root.querySelectorAll('.v3-box').forEach(box => {
                if (box.dataset.v3) return;
                box.dataset.v3 = '1';
                drawV3(box);
                if (v3Resize) v3Resize.observe(box);
            });
        }
        new MutationObserver(() => decorateV3()).observe(document.body, { childList: true, subtree: true });

        // 마법공학 테두리 ver.1 (로고 카드와 같은 모양)을 다른 카드 양옆에 복사
        let _hexCardN = 0;
        function hexCardOrn() {
            const n = ++_hexCardN;
            return ['left', 'right'].map(side => {
                const src = document.querySelector(`.hextech-hero-card .hex-ornament.${side}`);
                if (!src) return '';
                const suf = side === 'left' ? 'L' : 'R';
                return src.outerHTML.replace(new RegExp(`(id="|url\\(#)(f[A-Za-z]+?)${suf}(["\\)])`, 'g'), `$1$2C${n}${suf}$3`);
            }).join('');
        }

        // 매치업 상세: 두 챔피언이 같은 라인에서 맞붙었을 때 승률로 우세/불리 표시
        function laneMatchupStat(mine, opp) {
            const champs = ((window.CHAMP_DATA || {}).champs) || {};
            const norm = (x) => String(x || '').replace(/\s+/g, '');
            const findChamp = (n) => champs[n] || champs[Object.keys(champs).find(k => norm(k) === norm(n))];
            let best = null;
            const scan = (a, b, flip) => {
                const c = findChamp(a);
                if (!c || !c.roles) return;
                for (const [role, r] of Object.entries(c.roles)) {
                    const v = (r.vs || []).find(x => norm(x.name) === norm(b));
                    if (!v) continue;
                    const wr = parseFloat(v.winRate);
                    if (isNaN(wr)) continue;
                    if (!best || v.games > best.games) best = { role, games: v.games, wr: flip ? 100 - wr : wr };
                }
            };
            scan(mine, opp, false);
            scan(opp, mine, true);
            return best;
        }

        // 챔피언 이름 검색 (이름 / 줄임말 / 초성 / 영어) + 라인 필터
        function filterChampNames(query, line = 'all') {
            const q = String(query || '').trim().replace(/\s+/g, '').toLowerCase();
            const aliasHits = new Set(Object.entries(champAliases)
                .filter(([alias]) => q && alias.toLowerCase().includes(q)).map(([, official]) => official));
            return Object.keys(champDataList).sort((a, b) => a.localeCompare(b, 'ko')).filter(name => {
                if (line !== 'all' && !champLanes(name).includes(line)) return false;
                if (!q) return true;
                const plain = name.replace(/\s+/g, '').toLowerCase();
                return plain.includes(q) || toChosung(plain).includes(q) || aliasHits.has(name)
                    || String(champDataList[name]).toLowerCase().includes(q);
            });
        }

        (function setupBuildCard() {
            const input = document.getElementById('build-search');

            const grid = document.getElementById('side-build');
            const tabs = document.getElementById('build-tabs');
            if (!input) return;

            const hide = () => { box.classList.add('hidden'); box.innerHTML = ''; };
            input.addEventListener('input', () => {
                const list = input.value.trim() ? filterChampNames(input.value).slice(0, 6) : [];
                if (!list.length) { hide(); return; }
                box.innerHTML = list.map(name => `
                    <button type="button" data-build-name="${escHtml(name)}" class="w-full flex items-center gap-2 p-1.5 rounded-lg hover:bg-slate-800 text-left">
                        <img src="${getChampImgUrl(name)}" alt="" class="w-7 h-7 rounded-md object-cover border border-slate-700 bg-slate-800">
                        <span class="text-xs font-bold text-white">${escHtml(name)}</span>
                    </button>`).join('');
                box.classList.remove('hidden');
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const first = filterChampNames(input.value)[0];
                    if (first) { input.value = ''; hide(); openChampPage(first); }
                } else if (e.key === 'Escape') hide();
            });
            document.addEventListener('click', (e) => {
                if (!input.contains(e.target) && !box.contains(e.target)) hide();

                const btn = e.target.closest('[data-line]');

        // 빌드 카드 높이를 인기 구도 카드 높이에 맞춤 (메인 / 상세페이지 상단 둘 다)
        function syncBuildCardHeight() {

                </div>`;
            detailDynamicContent.querySelectorAll('[data-setting]').forEach(el => {
                el.addEventListener('change', () => {
                    const key = el.dataset.setting;
                    userSettings[key] = el.type === 'checkbox' ? el.checked : el.value;
                    if (key === 'defaultLine') applyDefaultLine();
                    saveSettings(); applySettings();

        function decorateLaneButtons() {

        // ───────────── 챔피언 선택 페이지 (전체 챔피언 초상화) ─────────────
        const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
        function toChosung(str) {
            return [...String(str)].map(ch => {
                const c = ch.charCodeAt(0) - 0xAC00;
                return (c >= 0 && c <= 11171) ? CHOSUNG[Math.floor(c / 588)] : ch;
            }).join('');

        function champMainRole(name) {
            const c = window.CHAMP_DATA && window.CHAMP_DATA.champs && window.CHAMP_DATA.champs[name];
            if (!c) return null;
            return Object.keys(c.roles).sort((x, y) => c.roles[y].games - c.roles[x].games)[0];

        // 챔피언이 실제로 가는 라인 전부: 주 라인 + 그 챔피언 판수의 8% 이상(최소 40판)인 라인
        // (예: 요네 = 미드 + 탑, 판테온 = 서폿 + 미드 + 정글)
        function champLanes(name) {
            const c = window.CHAMP_DATA && window.CHAMP_DATA.champs && window.CHAMP_DATA.champs[name];

            const total = Object.values(c.roles).reduce((a, r) => a + (Number(r.games) || 0), 0);

            return Object.keys(c.roles).filter(k => k === main
                || ((Number(c.roles[k].games) || 0) >= 40 && (Number(c.roles[k].games) || 0) / (total || 1) >= 0.08));

        // 1·2·3코어 빌드 순서
        // 카드 양옆 마법공학 테두리 (로고 카드 테두리를 작게 복사해서 씀)
        let _hexBoxN = 0;
        // 마법공학 테두리 ver.2 (위아래 가로선 없음)를 카드 높이에 맞춰 늘림:
        // 가운데 마름모 부분은 그대로 두고, 위·아래 곡선 부분만 세로로 늘려서 모양이 찌그러지지 않게
        function hexBoxOrn() {
            const src = document.querySelector('.hextech-hero-card .hex-ornament.left');
            if (!src) return '';
            const n = ++_hexBoxN;
            const base = src.outerHTML.replace(/<path d="M0 13 H108"[^>]*?(\/>|><\/path>)/g, '');
            const piece = (k, vb, par) => base
                .replace(/(id="|url\(#)(f[A-Za-z]+?)L(["\)])/g, `$1$2B${n}${k}$3`)
                .replace(/class="hex-ornament left"/, `class="box-orn-piece box-orn-${k}"`)
                .replace(/viewBox="0 0 140 398"/, `viewBox="${vb}"`)
                .replace(/preserveAspectRatio="[^"]*"/, `preserveAspectRatio="${par}"`);
            const col = piece('t', '0 0 140 142', 'none') + piece('m', '0 142 140 114', 'xMidYMid meet') + piece('b', '0 256 140 142', 'none');
            return ['left', 'right'].map(side => `<div class="box-ornament ${side}" aria-hidden="true">${col}</div>`).join('');
        }

        function renderCoreBuild(cores) {
            const arrow = `<div class="hidden sm:flex items-center justify-center text-amber-400 font-black text-xl">›</div>`;

                const alts = opts.slice(1);
                return `
                    <div class="v3-box flex-1 min-w-0 bg-slate-800/80 p-3">

                            </div>

                        ${alts.length ? `<div class="border-t border-slate-700 pt-2 space-y-1">

            const parts = [];
            cores.forEach((opts, i) => { if (i) parts.push(arrow); parts.push(col(opts, i + 1)); });

        // 룬 화면 (OP.GG 룬 표처럼): 룬마다 아이콘 + 승률 / 픽률 / 판수, 고른 룬은 밝게
        function runeNum(rec, total) {
            const g = rec ? rec[0] : 0, w = rec ? rec[1] : 0;
            const pct = (x) => (Math.round(x * 1000) / 10).toString().replace(/\.0$/, '') + '%';
            return { g, wr: g ? pct(w / g) : '0%', pick: total ? pct(g / total) : '0%' };
        }
        function renderRunePage(page, tree, stats) {
            const base = 'https://ddragon.leagueoflegends.com/cdn/img/';
            const styleOf = (id) => (tree.styles || []).find(st => st.id === id);
            const prim = styleOf(page.primary.style);
            const sub = styleOf(page.sub.style);
            if (!prim || !sub) return noDataText('룬 정보를 불러오지 못했어요.');
            const S = stats || { total: 0, prim: {}, sub: {}, shard: {} };
            const chosen = new Set([...page.primary.perks, ...page.sub.perks]);

            const cell = (icon, name, on, rec, size) => {
                const n = runeNum(rec, S.total);
                return `
                    <div class="flex flex-col items-center w-[58px] flex-shrink-0">
                        <img src="${base}${icon}" alt="${escHtml(name)}" title="${escHtml(name)}" onerror="this.style.visibility='hidden'"
                            class="${size} rounded-full ${on ? 'ring-2 ring-amber-400 bg-slate-950' : 'opacity-35 grayscale'}">
                        ${stats ? `
                        <div class="mt-1 text-[11px] leading-tight text-center">
                            <div class="font-bold ${on ? 'text-sky-400' : 'text-slate-500'}">${n.wr}</div>
                            <div class="font-black ${on ? 'text-white' : 'text-slate-500'}">${n.pick}</div>
                            <div class="text-[10px] text-slate-600">${n.g.toLocaleString()}</div>
                        </div>` : ''}
                    </div>`;
            };
            const treeRows = (st, slots, src) => slots.map((row, i) => `
                <div class="flex items-start justify-center gap-1">
                    ${row.map(r => cell(r.icon, r.name, chosen.has(r.id), S[src][String(r.id)], i === 0 && src === 'prim' ? 'w-11 h-11' : 'w-9 h-9')).join('')}
                </div>`).join('');

            const shards = tree.shards || {};
            const shardRows = (tree.shardRows || []).map((row, i) => `
                <div class="flex items-start justify-center gap-1">
                    ${row.map(id => {
                        const sh = shards[String(id)] || { name: id, icon: '' };
                        return cell(sh.icon, sh.name, page.shards[i] === Number(id), S.shard[`${i}:${id}`], 'w-8 h-8 p-0.5');
                    }).join('')}
                </div>`).join('');

            const col = (inner, label, icon) => `
                <div class="flex flex-col justify-between gap-4 py-1">
                    <div class="flex flex-col gap-4">${inner}</div>
                    <div class="flex items-center justify-center gap-1.5 text-sm font-bold text-slate-300">
                        ${icon ? `<img src="${base}${icon}" alt="" class="w-5 h-5" onerror="this.style.visibility='hidden'">` : ''}${escHtml(label)}
                    </div>
                </div>`;
            // 보조 룬·파편 칸은 핵심 룬 줄 높이만큼 비워서 줄을 맞춤
            const spacer = `<div class="hidden md:block ${stats ? 'h-[88px]' : 'h-11'}"></div>`;
            return `
                <div class="v3-box bg-slate-800/80 p-3">
                    <div class="grid grid-cols-1 md:grid-cols-3 md:divide-x divide-slate-700/80 gap-y-6">
                        ${col(treeRows(prim, prim.slots, 'prim'), prim.name, prim.icon)}
                        ${col(spacer + treeRows(sub, sub.slots.slice(1), 'sub'), sub.name, sub.icon)}
                        ${col(spacer + shardRows, '능력치 파편', '')}
                    </div>
                </div>`;
        }

        // 룬 페이지 탭: 핵심 룬·주 룬·보조 룬 아이콘 + 픽률(판수) + 승률
        function runeTabsHtml(pages, tree) {
            const base = 'https://ddragon.leagueoflegends.com/cdn/img/';
            const styleOf = (id) => (tree.styles || []).find(st => st.id === id);
            const perkOf = (st, id) => st && st.slots.flat().find(r => r.id === id);
            return pages.map((pg, i) => {
                const prim = styleOf(pg.primary.style), sub = styleOf(pg.sub.style);
                const key = perkOf(prim, pg.primary.perks[0]);
                const img = (o, cls) => o ? `<img src="${base}${o.icon}" alt="${escHtml(o.name)}" title="${escHtml(o.name)}" class="${cls}" onerror="this.style.visibility='hidden'">` : '';
                return `
                    <button type="button" data-rune-idx="${i}" class="rune-tab flex-1 min-w-[260px] flex items-center justify-between gap-3 px-4 py-3 rounded-lg border cursor-pointer transition-colors ${i === 0 ? 'bg-slate-700/70 border-amber-400/60' : 'bg-slate-900/60 border-slate-700 hover:bg-slate-800'}">
                        <div class="flex items-center gap-2">
                            ${img(prim, 'w-6 h-6 opacity-80')}${img(key, 'w-10 h-10 rounded-full bg-slate-950')}${img(sub, 'w-6 h-6 opacity-80')}
                        </div>
                        <div class="text-center leading-tight">
                            <div class="text-sm font-black text-white">${pg.pick}</div>
                            <div class="text-[11px] text-slate-400">${Number(pg.games || 0).toLocaleString()} 게임</div>
                            <div class="text-[11px] text-slate-400">픽률</div>
                        </div>
                        <div class="text-center leading-tight">
                            <div class="text-sm font-black text-sky-400">${pg.winRate}</div>
                            <div class="text-[11px] text-slate-400">승률</div>
                        </div>
                    </button>`;
            }).join('');
        }

        function renderChampPage(name, role) {
            const data = window.CHAMP_DATA;
            const champ = data && data.champs ? data.champs[name] : null;
            const box = (inner) => `<div class="bg-slate-900/90 rounded-3xl p-6 sm:p-8 border border-amber-500/40 shadow-xl max-w-4xl mx-auto">${inner}</div>`;
            if (!champ || !role) {
                detailDynamicContent.innerHTML = box(`
                    <div class="flex flex-col items-center gap-3 text-center">
                        ${iconImg(getChampImgUrl(name), name, 'w-16 h-16')}
                        <h2 class="text-2xl font-black text-yellow-300">${escHtml(name)}</h2>
                        ${noDataText('이번 패치 표본이 부족해서 아직 상세 정보를 보여줄 수 없어요. 데이터가 쌓이면 나타나요.')}
                    </div>`);
                return;
            }
            const r = champ.roles[role];
            const meta = data.meta || {};
            const runeBase = 'https://ddragon.leagueoflegends.com/cdn/img/';
            const roleTabs = Object.keys(champ.roles).map(k => `
                <button type="button" onclick="openChampPage('${escJs(name)}', '${k}', false)" data-lane-icon="${k}" class="px-3 py-1.5 rounded-xl font-bold text-xs cursor-pointer ${k === role ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-white hover:bg-slate-700'}">${LINE_NAMES[k]}</button>`).join('');
            const statBox = (label, value, cls = 'text-white') => `
                <div class="bg-slate-800/80 border border-slate-700 rounded-2xl px-3 py-3 text-center">
                    <div class="text-sm font-bold text-slate-300">${label}</div>
                    <div class="text-2xl font-black mt-0.5 ${cls}">${value}</div>
                </div>`;
            const section = (title, inner, sub = '') => `
                <div class="mb-6">
                    <div class="flex items-end justify-between mb-2">
                        <h3 class="text-base font-black text-yellow-300">${title}</h3>
                        <span class="text-[10px] text-slate-500">${sub}</span>
                    </div>
                    ${inner}
                </div>`;

            const items = (r.items || []).map(it => statRow(iconImg(getItemImgUrl(it.id), it.name, 'w-10 h-10'), escHtml(it.name), it)).join('');
            const boots = (r.bootsList || (r.boots ? [r.boots] : [])).map(it => statRow(iconImg(getItemImgUrl(it.id), it.name, 'w-10 h-10'), escHtml(it.name), it)).join('');
            const keystones = (r.keystones || (r.keystone ? [r.keystone] : [])).map(k => statRow(iconImg(runeBase + k.icon, k.name, 'w-10 h-10', 'rounded-full'), escHtml(k.name), k)).join('');
            const secondaries = (r.secondaries || []).map(k => statRow(iconImg(runeBase + k.icon, k.name, 'w-10 h-10', 'rounded-full border-0'), `보조 ${escHtml(k.name)}`, k)).join('');
            const spells = (r.spellsList || (r.spells ? [r.spells] : [])).map(sp => statRow(
                `<div class="flex gap-1 flex-shrink-0">${sp.list.map(x => iconImg(`https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/spell/${x.id}.png`, x.name, 'w-9 h-9')).join('')}</div>`,
                sp.list.map(x => escHtml(x.name)).join(' + '), sp)).join('');

            const oppBtn = (o) => `
                <button type="button" onclick="openMatchupFromSide('${escJs(name)}', '${escJs(o.name)}')" class="side-chip flex items-center gap-2 w-full p-2 rounded-xl border border-slate-700 bg-slate-800/80 text-left">
                    ${iconImg(champImg(o.name, o.id), o.name, 'w-9 h-9')}
                    <span class="text-sm font-bold text-white truncate flex-1 min-w-0">${escHtml(o.name)}</span>
                    <span class="text-right flex-shrink-0">
                        <span class="block text-sm font-black ${wrColor(o.winRate)}">${o.winRate}</span>
                        <span class="block text-[10px] text-slate-500">${Number(o.games).toLocaleString()}판</span>
                    </span>
                </button>`;
            // 승률 50% 미만은 어려운 상대, 50% 초과는 쉬운 상대 (각각 최대 3명)
            const vsAll = r.vs || [];
            const hardList = vsAll.length
                ? vsAll.filter(o => parseFloat(o.winRate) < 50).sort((a, b) => parseFloat(a.winRate) - parseFloat(b.winRate) || b.games - a.games).slice(0, 3)
                : (r.hard || []).filter(o => parseFloat(o.winRate) < 50);
            const easyList = vsAll.length
                ? vsAll.filter(o => parseFloat(o.winRate) > 50).sort((a, b) => parseFloat(b.winRate) - parseFloat(a.winRate) || b.games - a.games).slice(0, 3)
                : (r.easy || []).filter(o => parseFloat(o.winRate) > 50);

            detailDynamicContent.innerHTML = box(`
                <div class="flex flex-col sm:flex-row sm:items-center gap-4 mb-6">
                    ${iconImg(champImg(name, champ.id), name, 'w-20 h-20', 'rounded-2xl border-2 border-amber-400')}
                    <div class="flex-1 min-w-0">
                        <h2 class="text-3xl font-black text-white mb-2">${escHtml(name)}</h2>
                        <div class="flex flex-wrap gap-1.5">${roleTabs}</div>
                    </div>
                    <button type="button" onclick="selectDraftChamp1('${escJs(name)}', 'mine'); showMainView(true);" class="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-sm rounded-xl cursor-pointer shadow self-start sm:self-center">내 챔피언으로 상성 검색</button>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
                    ${statBox('승률', r.winRate, wrColor(r.winRate))}
                    ${statBox('픽률', r.pickRate)}
                    ${statBox('밴률', r.banRate)}
                    ${statBox('표본', `${Number(r.games).toLocaleString()}판`)}
                </div>
                <p class="text-xs text-slate-400 mb-6">${meta.patch ? `패치 ${escHtml(displayPatch(meta.patch))} · 한국 서버 ${escHtml(meta.tierLabel || '')} 솔로랭크 ${LINE_NAMES[role]} 기준` : ''}</p>
                ${Number(r.games) < 30 ? `<div class="-mt-4 mb-6 px-4 py-2.5 rounded-xl border border-amber-500/40 bg-amber-500/10 text-sm text-amber-200 font-bold">이 라인은 아직 ${Number(r.games)}판밖에 모이지 않아서 빌드·룬 숫자가 정확하지 않을 수 있어요. 데이터가 쌓이면 점점 정확해져요.</div>` : ''}

                ${(r.cores || []).length
                    ? section('핵심 아이템 빌드 순서', renderCoreBuild(r.cores), '구매 순서 기준 · 코어별 가장 많이 산 아이템')
                    : section('핵심 아이템', items ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${items}</div>` : noDataText('표본 부족'), '많이 가는 순서 · 막대는 픽률')}
                ${(r.runePages || []).length && data.runeTree
                    ? section('추천 룬', `<div id="rune-tabs" class="flex flex-wrap gap-2 mb-3">${runeTabsHtml(r.runePages, data.runeTree)}</div>
                        <div id="rune-page-box">${renderRunePage(r.runePages[0], data.runeTree, r.runeStats)}</div>`,
                        '룬마다 승률 · 픽률 · 판수')
                    : section('룬', (keystones || secondaries) ? `<div class="space-y-2">${keystones}${secondaries}</div>` : noDataText('표본 부족'))}
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
                    ${section('신발', boots ? `<div class="space-y-2">${boots}</div>` : noDataText('표본 부족'))}
                    ${section('소환사 주문', spells ? `<div class="space-y-2">${spells}</div>` : noDataText('표본 부족'))}
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
                    ${section('어려운 상대 TOP 3', hardList.length ? `<div class="space-y-2">${hardList.map(oppBtn).join('')}</div>` : noDataText('아직 표본이 부족해요. 데이터가 쌓이면 채워져요.'), '누르면 상성 보기')}
                    ${section('쉬운 상대 TOP 3', easyList.length ? `<div class="space-y-2">${easyList.map(oppBtn).join('')}</div>` : noDataText('아직 표본이 부족해요. 데이터가 쌓이면 채워져요.'), '누르면 상성 보기')}
                </div>
            `);
            const runeTabs = document.getElementById('rune-tabs');
            if (runeTabs) runeTabs.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-rune-idx]');
                if (!btn) return;
                const idx = Number(btn.dataset.runeIdx);
                document.getElementById('rune-page-box').innerHTML = renderRunePage(r.runePages[idx], data.runeTree, r.runeStats);
                runeTabs.querySelectorAll('[data-rune-idx]').forEach(b => {
                    const on = b === btn;
                    b.classList.toggle('bg-slate-700/70', on); b.classList.toggle('border-amber-400/60', on);
                    b.classList.toggle('bg-slate-900/60', !on); b.classList.toggle('border-slate-700', !on);
                });
            });
        }

        // 경기 데이터 버전(16.22)으로 저장된 예전 파일도 실제 패치 이름(26.22)으로 보여줌
        function displayPatch(p) {
            const m = String(p || '').match(/^(\d+)\.(\d+)/);
            if (!m) return p;
            const major = Number(m[1]);
            return `${major < 20 ? major + 10 : major}.${m[2]}`;
        }

        // 카드 아무 곳이나 누르면 해당 상세페이지로 이동 (카드 안 버튼은 각자 동작)
        const SIDE_CARD_TARGET = {
            'card-popular': () => renderPage('hot', true),
            'card-op': () => renderPage('ranking', true),
            'card-build': () => renderPage('champs', true),
            'card-patch': () => renderPage('patch', true),
        };
        Object.entries(SIDE_CARD_TARGET).forEach(([id, go]) => {
            const card = document.getElementById(id);
            if (!card) return;
            card.setAttribute('role', 'link');
            card.setAttribute('tabindex', '0');
            card.addEventListener('click', (e) => {
                if (e.target.closest('button, a, input')) return;
                go();
            });
            card.addEventListener('keydown', (e) => {
                if ((e.key === 'Enter' || e.key === ' ') && e.target === card) { e.preventDefault(); go(); }
            });
        });

        let hotLine = 'top';
        function renderHotPage() {
            const all = (window.CHAMP_DATA && window.CHAMP_DATA.popular) || [];
            const meta = (window.CHAMP_DATA && window.CHAMP_DATA.meta) || {};
            const list = all.filter(m => m.role === hotLine).slice(0, 5);
            const tabs = Object.entries(LINE_NAMES).map(([k, v]) => `
                <button type="button" data-hot-line="${k}" class="px-4 py-2 rounded-xl font-bold text-sm cursor-pointer shadow ${k === hotLine ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-white hover:bg-slate-700'}">${v}</button>`).join('');
            detailDynamicContent.innerHTML = `
                <div class="bg-slate-900/90 rounded-3xl p-6 sm:p-8 border border-amber-500/40 shadow-xl max-w-3xl mx-auto">
                    <h2 class="text-2xl font-black text-yellow-300 mb-1 text-center">라인별 인기 구도 TOP 5</h2>
                    <p class="text-[11px] text-slate-500 text-center mb-5">${meta.patch ? `패치 ${escHtml(displayPatch(meta.patch))} · 같은 라인에서 가장 많이 만난 조합` : ''}</p>
                    <div id="hot-tabs" class="flex flex-wrap justify-center gap-2 mb-6">${tabs}</div>
                    <div class="space-y-2">
                        ${list.length ? list.map((m, i) => `
                            <button type="button" onclick="openMatchupFromSide('${escJs(m.a)}', '${escJs(m.b)}')" class="side-chip w-full flex items-center justify-between gap-2 p-3 bg-slate-800/90 rounded-2xl border border-slate-700 text-left">
                                <span class="flex items-center gap-2 min-w-0">
                                    <span class="text-yellow-400 font-black w-6 text-center flex-shrink-0">${i + 1}</span>
                                    ${iconImg(champImg(m.a, m.aId), m.a, 'w-9 h-9')}
                                    <span class="font-bold text-white text-sm truncate">${escHtml(m.a)}</span>
                                    <span class="text-amber-400 font-black text-xs">vs</span>
                                    ${iconImg(champImg(m.b, m.bId), m.b, 'w-9 h-9')}
                                    <span class="font-bold text-white text-sm truncate">${escHtml(m.b)}</span>
                                </span>
                                <span class="text-right flex-shrink-0">
                                    <span class="block text-xs text-slate-300">${Number(m.games).toLocaleString()}판</span>
                                    <span class="block text-[11px] text-slate-500">${escHtml(m.a)} 승률 <b class="${wrColor(m.aWinRate)}">${m.aWinRate}</b></span>
                                </span>
                            </button>`).join('') : noDataText('이 라인은 아직 표본이 부족해요. 데이터가 쌓이면 나타나요.')}
                    </div>
                </div>`;
            document.getElementById('hot-tabs').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-hot-line]');
                if (!btn) return;
                hotLine = btn.dataset.hotLine;
                renderHotPage();
            });
        }

        function renderPatchPage() {
            const pn = window.PATCH_NOTES;
            if (!pn) {
                detailDynamicContent.innerHTML = `<div class="bg-slate-900/90 rounded-3xl p-8 border border-amber-500/40 shadow-xl text-center">${noDataText('패치노트 정보가 아직 없어요.')}</div>`;
                return;
            }
            // 바뀐 수치 한 줄: [스킬키] 스킬 이름 · 항목   이전 → 이후
            const keyBadge = (k) => {
                if (!k) return '';
                const label = k === 'P' ? '패시브' : k;
                return `<span class="inline-flex items-center justify-center min-w-[28px] h-6 px-1.5 rounded-md bg-slate-950 border border-amber-500/50 text-amber-300 text-xs font-black flex-shrink-0">${escHtml(label)}</span>`;
            };
            const afterCls = (change) => change === '상향' ? 'text-emerald-300' : change === '하향' ? 'text-rose-300' : 'text-sky-300';
            const changeRows = (list, change) => (list || []).map(([k, skill, stat, before, after]) => `
                <div class="py-2.5 border-t border-slate-700/70 first:border-t-0">
                    <div class="flex items-center gap-2 mb-1">
                        ${keyBadge(k)}
                        <span class="text-sm font-bold text-white">${escHtml([skill, stat].filter(Boolean).join(' · '))}</span>
                    </div>
                    <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-sm pl-0.5">
                        ${before && before !== '-' ? `<span class="text-slate-400">${escHtml(before)}</span><span class="text-amber-400 font-black">→</span>` : ''}
                        <span class="font-bold ${afterCls(change)}">${escHtml(after)}</span>
                    </div>
                </div>`).join('');
            const card = (x, img, onclick) => {
                const wide = (x.list || []).length > 4;   // 멜처럼 바뀐 게 많은 카드는 가로로 넓게
                return `
                <div class="patch-card v3-box bg-slate-800/70 p-4 ${wide ? 'wide md:col-span-2' : ''}">
                    <div class="flex items-center gap-3 mb-2">
                        ${onclick ? `<button type="button" onclick="${onclick}" class="flex-shrink-0 cursor-pointer" title="챔피언 상세 보기">${iconImg(img, x.name, 'w-12 h-12')}</button>` : iconImg(img, x.name, 'w-12 h-12')}
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2">
                                <span class="text-base font-black text-white">${escHtml(x.name)}</span>
                                <span class="text-[11px] font-black px-1.5 py-0.5 rounded border ${patchChangeClass(x.change)}">${escHtml(x.change)}</span>
                            </div>
                            ${x.tldr ? `<p class="text-sm text-amber-100/90 font-bold mt-0.5 leading-snug">${escHtml(x.tldr)}</p>` : ''}
                        </div>
                    </div>
                    ${x.list && x.list.length ? `<div class="bg-slate-900/70 rounded-xl px-3 py-1 mt-3 ${wide ? 'md:grid md:grid-cols-2 md:gap-x-6 md:[&>*:nth-child(2)]:border-t-0' : ''}">${changeRows(x.list, x.change)}</div>` : ''}
                </div>`;
            };
            const section = (change) => {
                const list = (pn.champions || []).filter(c => c.change === change);
                if (!list.length) return '';

            const cards = [...document.querySelectorAll('.patch-card:not(.wide)')];

            ['card-popular', 'side-left'], ['card-op', 'side-left'],

        function placeSideCards(toDetail) {
            const zone = document.getElementById('extension-zone');
            SIDE_CARD_HOME.forEach(([cardId, homeId]) => {
                const card = document.getElementById(cardId);
                if (!card) return;
                (toDetail ? zone : document.getElementById(homeId)).appendChild(card);
            });
            requestAnimationFrame(syncBuildCardHeight);
        }

        function switchToDetailView(type, subType, pushHistory = true) {
            if (typeof subType === 'boolean') { pushHistory = subType; subType = type; }
            mainView.classList.add('hidden'); mainView.classList.remove('grid');
            detailView.classList.remove('hidden'); detailView.classList.add('flex');
            placeSideCards(true);
            searchSuggestions1.classList.add('hidden'); searchSuggestions2.classList.add('hidden');
            if (pushHistory) history.pushState({ view: 'detail', type, subType }, '', '');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showMainView(pushHistory = true) {
            detailView.classList.add('hidden'); detailView.classList.remove('flex');
            placeSideCards(false);
            mainView.classList.remove('hidden'); mainView.classList.add('grid');
            searchInput1.value = ''; searchInput2.value = '';
            searchSuggestions1.classList.add('hidden'); searchSuggestions2.classList.add('hidden');
            if (pushHistory) history.pushState({ view: 'main' }, '', '');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.view === 'detail') {
                if (e.state.type === 'search') runSearch(e.state.subType, false);

                    const [n, r] = String(e.state.subType || '').split('|');
                    openChampPage(n, r || null, false);

            }
        });

        backToHomeBtn.addEventListener('click', (e) => { e.preventDefault(); showMainView(true); });
        brandLogo.addEventListener('click', (e) => { e.preventDefault(); showMainView(true); });

        searchForm1.addEventListener('submit', e => {
            e.preventDefault();
            searchSuggestions1.classList.add('hidden');
            runSearch(searchInput1.value, true);
        });

        searchForm2.addEventListener('submit', e => {
            e.preventDefault();
            searchSuggestions2.classList.add('hidden');
            const val = searchInput2.value.trim();
            if (!val) return;

            const fourMatch = parseBottom4Matchup(val);
            if (fourMatch) {
                runBottom2v2Search(fourMatch.myAdc, fourMatch.mySup, fourMatch.oppAdc, fourMatch.oppSup, val, true);
            } else {
                runSearch(val, true);
            }
        });

        function showAlertModal(html) {
            if (modalContainer.classList.contains('hidden')) lastFocused = document.activeElement;
            modalContent.innerHTML = html;
            modalContainer.classList.remove('hidden'); modalContainer.classList.add('flex');
            document.body.style.overflow = 'hidden';
            const focusTarget = document.getElementById('modal-opp-input') || document.getElementById('modal-close');
            if (focusTarget) focusTarget.focus();
        }

        function closeAlertModal() {
            modalContainer.classList.add('hidden'); modalContainer.classList.remove('flex');
            document.body.style.overflow = '';
            if (lastFocused) lastFocused.focus();
        }

        document.addEventListener('click', e => {
            const queryEl = e.target.closest('[data-query]');
            if (queryEl) { e.stopPropagation(); closeAlertModal(); runSearch(queryEl.dataset.query, true); return; }

            const pageEl = e.target.closest('[data-page]');
            if (pageEl) { renderPage(pageEl.dataset.page, true); return; }

            if (e.target === modalContainer || e.target.closest('#modal-close')) closeAlertModal();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && !modalContainer.classList.contains('hidden')) closeAlertModal();
        });

        // 문의·제보 스팸 막기: 봇만 채우는 숨은 칸 + 1분에 한 번 + 글자 수 제한
        const SEND_COOLDOWN_MS = 60 * 1000;
        function isBotSubmit(form) {
            const hp = form.querySelector('[name="website"]');
            return !!(hp && hp.value);
        }
        function cooldownLeft() {
            let last = 0;
            try { last = Number(localStorage.getItem('mvplol_last_send')) || 0; } catch (e) { /* 저장 불가 */ }
            return Math.max(0, SEND_COOLDOWN_MS - (Date.now() - last));
        }
        function markSent() {
            try { localStorage.setItem('mvplol_last_send', String(Date.now())); } catch (e) { /* 저장 불가 */ }
        }

        document.addEventListener('submit', async e => {
            if (e.target.id !== 'bug-form') return;
            e.preventDefault();
            const form = e.target;
            const content = form.content.value.trim();
            const err = document.getElementById('bug-error');
            if (!content) { err.classList.remove('hidden'); form.content.focus(); return; }
            const wait = cooldownLeft();
            if (wait > 0 && !isBotSubmit(form)) {
                err.textContent = `방금 보내셨어요. ${Math.ceil(wait / 1000)}초 뒤에 다시 보내 주세요.`;
                err.classList.remove('hidden');
                return;
            }
            err.classList.add('hidden');
            const btn = form.querySelector('button[type="submit"]');
            btn.disabled = true; btn.textContent = '보내는 중...';
            // 기존 제보용 구글 시트로 같이 보냄 (구도 칸 = 문의 유형, 내용 칸 = 상세 내용)
            const tip = [
                content,
                form.where.value.trim() ? `[위치] ${form.where.value.trim()}` : '',
                form.contact.value.trim() ? `[연락처] ${form.contact.value.trim()}` : '',
                `[브라우저] ${navigator.userAgent}`,
                `[화면] ${window.innerWidth}x${window.innerHeight}`,
            ].filter(Boolean).join('\n');
            try {
                const body = new URLSearchParams({ matchup: `[버그 문의] ${form.bugType.value}`, tip: tip.slice(0, 2600), page: location.href });
                if (!isBotSubmit(form)) {   // 봇이면 보내지 않고 접수된 척만
                    await fetch(SHEET_URL, { method: 'POST', body, mode: 'no-cors' });
                    markSent();
                }
                detailDynamicContent.innerHTML = `
                    <div class="bg-slate-900/95 rounded-3xl p-8 border border-amber-500/40 shadow-xl text-center max-w-xl mx-auto py-16">
                        <h2 class="text-2xl font-black text-yellow-300 mb-2">문의가 접수되었어요</h2>
                        <p class="text-sm text-slate-300 mb-6">알려 주셔서 감사해요. 확인 후 반영할게요.</p>
                        <button type="button" onclick="showMainView(true)" class="bg-amber-400 hover:bg-amber-500 text-slate-950 font-black px-6 py-3 rounded-2xl text-sm cursor-pointer shadow-lg">메인으로 돌아가기</button>
                    </div>`;
            } catch (error) {
                console.error('전송 실패:', error);
                btn.disabled = false; btn.textContent = '문의 보내기';
                err.textContent = '전송에 실패했어요. 잠시 후 다시 시도해 주세요.';
                err.classList.remove('hidden');
            }
        });

        document.addEventListener('submit', async e => {
            if (e.target.id !== 'feedback-form') return;
            e.preventDefault();
            const form = e.target;
            const matchup = form.matchup.value.trim();
            const tip = form.tip.value.trim();
            if (!matchup || !tip) return;
            if (cooldownLeft() > 0 && !isBotSubmit(form)) {
                showAlertModal('<p class="text-center text-slate-200 py-4">방금 보내셨어요. 1분 뒤에 다시 보내 주세요.</p>');
                return;
            }

            try {
                const body = new URLSearchParams({ matchup: matchup.slice(0, 100), tip: tip.slice(0, 2000), page: location.href });
                if (!isBotSubmit(form)) {
                    await fetch(SHEET_URL, { method: 'POST', body, mode: 'no-cors' });
                    markSent();
                }
                detailDynamicContent.innerHTML = `
                    <div class="bg-slate-900/95 rounded-3xl p-8 border border-amber-500/40 shadow-xl text-center max-w-xl mx-auto py-16">
                        <h2 class="text-2xl font-black text-yellow-300 mb-2">공략 제보가 완료되었습니다!</h2>
                        <button type="button" onclick="showMainView(true)" class="bg-amber-400 hover:bg-amber-500 text-slate-950 font-black px-6 py-3 rounded-2xl text-sm cursor-pointer shadow-lg">메인으로 돌아가기</button>
                    </div>
                `;
            } catch (err) {
                console.error('전송 실패:', err);
            }
        });
    </script>

    <script>
    // 로고 MVP / LOL: 두 글자 똑같은 기준으로, 폰트마다 글자 윗/아랫 여백이 달라서 대문자 실제 높이를 재서 정중앙으로 맞춤
    (function () {
        function centerLogoText() {
            var ctx = document.createElement('canvas').getContext('2d');
            document.querySelectorAll('.logo-font > span').forEach(function (el) {
                var cs = getComputedStyle(el);
                var size = parseFloat(cs.fontSize);
                ctx.font = cs.fontWeight + ' ' + size + 'px ' + cs.fontFamily;
                var m = ctx.measureText('MVPLOL');
                if (!m.fontBoundingBoxAscent) return;
                var fA = m.fontBoundingBoxAscent, fD = m.fontBoundingBoxDescent;
                var lh = parseFloat(cs.lineHeight) || size;
                var baseline = (lh - fA - fD) / 2 + fA;            // 줄 위에서 글자 기준선까지
                var capMid = baseline - (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
                el.style.setProperty('--cap-shift', (lh / 2 - capMid).toFixed(2) + 'px');
            });
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(centerLogoText);
        window.addEventListener('load', centerLogoText);
        window.addEventListener('resize', centerLogoText);
        centerLogoText();
    })();
    </script>
</body>
