        .hextech-card {

            justify-content: center;
        }

        .hextech-card:hover {

        }

        .modal-overlay {

            backdrop-filter: blur(8px);
        }

        .modal-body {
            animation: modalSlide 0.25s ease-out forwards;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }

        * {

        function getSpellNames(spellText) {

            const text = String(spellText || '');
            const found = names
                .map(n =>({ n, i: text.indexOf(n) }))
                .filter(o =>o.i !== -1)
                .sort((a, b) =>a.i - b.i)
                .map(o =>(o.n === '텔레포트' ? '순간이동' : o.n));
            const unique = [...new Set(found)].slice(0, 2);
            return unique.length ? unique : ['점멸', '점화'];
        }

        function getItemIdFromText(itemText) {
            const text = String(itemText || '');
            const num = text.match(/^\d+/);
            if (num) return num[0];
            let best = null;
            for (const [name, id] of Object.entries(itemNameToId)) {
                const i = text.indexOf(name);
                if (i === -1) continue;
                if (!best || i < best.i || (i === best.i && name.length >best.name.length)) {
                    best = { i, name, id };
                }
            }
            return best ? best.id : '3152';
        }

            const clean = input.trim().replace(/\s+/g, '');

        function parseMatchup(raw) {
            let text = raw.trim().replace(/\s+/g, ' ');
            if (!text) return null;

            let parts = text.split(/\s*vs\.?\s*|\s+versus\s+|\s*[,/:]\s*|\s+대\s+/i)
                .map(s =>s.trim())
                .filter(Boolean);

            if (parts.length === 2) {
                let m = getValidChampName(parts[0]);
                let o = getValidChampName(parts[1]);
                if (m && o) return { mine: m, opp: o };
            }

            let words = text.split(' ');
            if (words.length >= 2) {
                for (let i = 1; i < words.length; i++) {
                    let part1 = words.slice(0, i).join(' ');
                    let part2 = words.slice(i).join(' ');
                    let m = getValidChampName(part1);
                    let o = getValidChampName(part2);
                    if (m && o) return { mine: m, opp: o };
                }
            }
            return null;
        }

        function parseBottom4Matchup(raw) {
            let text = raw.trim().replace(/\s+/g, ' ');
            if (!text) return null;

            let tokens = text.split(/\s*vs\.?\s*|\s*[,/]\s*|\s+/i)
                .map(s =>s.trim())
                .filter(Boolean);

            if (tokens.length >= 4) {
                let c1 = getValidChampName(tokens[0]);
                let c2 = getValidChampName(tokens[1]);
                let c3 = getValidChampName(tokens[2]);
                let c4 = getValidChampName(tokens[3]);
                if (c1 && c2 && c3 && c4) {
                    return { myAdc: c1, mySup: c2, oppAdc: c3, oppSup: c4 };
                }
            }
            return null;
        }

                el.innerHTML = `<p class="col-span-full text-xs text-slate-500 leading-relaxed py-2">${buildLine === 'all' ? '챔피언 정보를 불러오는 중이에요.' : '라인 데이터를 모으는 중이에요. 매일 새벽에 갱신돼요.'}</p>`;
                return;
            }
            el.innerHTML = names.map(name => `
                <button type="button" data-build-name="${escHtml(name)}" class="side-chip rounded-lg" title="${escHtml(name)}">
                    <img src="${getChampImgUrl(name)}" alt="${escHtml(name)}" loading="lazy" class="w-full aspect-square rounded-lg object-cover border border-slate-700 bg-slate-800 hover:border-amber-400">
                </button>`).join('');
        }

        (function setupBuildCard() {
            const input = document.getElementById('build-search');
            const box = document.getElementById('build-suggest');
            const grid = document.getElementById('side-build');
            const tabs = document.getElementById('build-tabs');
            if (!input) return;

            const hide = () => { box.classList.add('hidden'); box.innerHTML = ''; };
            input.addEventListener('input', () => {
                const list = input.value.trim() ? filterChampNames(input.value).slice(0, 6) : [];
                if (!list.length) { hide(); return; }
                box.innerHTML = list.map(name => `
                    <button type="button" data-build-name="${escHtml(name)}" class="w-full flex items-center gap-2 p-1.5 rounded-lg hover:bg-slate-800 text-left">
                        <img src="${getChampImgUrl(name)}" alt="" class="w-7 h-7 rounded-md object-cover border border-slate-700 bg-slate-800">
                        <span class="text-xs font-bold text-white">${escHtml(name)}</span>
                    </button>`).join('');
                box.classList.remove('hidden');
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const first = filterChampNames(input.value)[0];
                    if (first) { input.value = ''; hide(); openChampPage(first); }
                } else if (e.key === 'Escape') hide();
            });
            document.addEventListener('click', (e) => {
                if (!input.contains(e.target) && !box.contains(e.target)) hide();
            });
            const pick = (e) => {
                const btn = e.target.closest('[data-build-name]');
                if (!btn) return;
                input.value = ''; hide();
                openChampPage(btn.dataset.buildName);
            };
            box.addEventListener('click', pick);
            grid.addEventListener('click', pick);
            tabs.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-line]');
                if (!btn) return;
                buildLine = btn.dataset.line;
                tabs.querySelectorAll('.side-tab').forEach(b => b.classList.toggle('active', b === btn));
                renderSideBuild();
            });
        })();

        // 빌드 카드 높이를 인기 구도 카드 높이에 맞춤 (메인 / 상세페이지 상단 둘 다)
        function syncBuildCardHeight() {
            const ref = document.getElementById('card-popular');
            const build = document.getElementById('card-build');
            if (!ref || !build) return;
            const h = ref.offsetHeight;
            if (h > 0) build.style.height = h + 'px';
        }
        window.addEventListener('resize', syncBuildCardHeight);

        function renderSidePanels() {
            renderSidePopular();
            renderSideOp();
            renderSidePatch();
            renderSideBuild();
            requestAnimationFrame(syncBuildCardHeight);
        }

        document.getElementById('side-op-tabs').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-line]');
            if (!btn) return;
            sideOpLine = btn.dataset.line;
            document.querySelectorAll('#side-op-tabs .side-tab').forEach(b =>b.classList.toggle('active', b === btn));
            renderSideOp();
        });

        // ───────────── 챔피언 선택 페이지 (전체 챔피언 초상화) ─────────────
        const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
        function toChosung(str) {
            return [...String(str)].map(ch => {
                const c = ch.charCodeAt(0) - 0xAC00;
                return (c >= 0 && c <= 11171) ? CHOSUNG[Math.floor(c / 588)] : ch;
            }).join('');
        }
        function champMainRole(name) {
            const c = window.CHAMP_DATA && window.CHAMP_DATA.champs && window.CHAMP_DATA.champs[name];
            if (!c) return null;
            return Object.keys(c.roles).sort((x, y) => c.roles[y].games - c.roles[x].games)[0];
        }

        let champSelectLine = 'all';
        let champSelectQuery = '';

        function renderChampSelectPage() {
            const tabs = [['all', '전체'], ...Object.entries(LINE_NAMES)].map(([k, v]) => `
                <button type="button" data-cs-line="${k}" class="px-3.5 py-1.5 rounded-xl font-bold text-sm cursor-pointer ${k === champSelectLine ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-white hover:bg-slate-700'}">${v}</button>`).join('');
            detailDynamicContent.innerHTML = `
                <div class="bg-slate-900/90 rounded-3xl p-6 sm:p-8 border border-amber-500/40 shadow-xl">
                    <h2 class="text-2xl font-black text-yellow-300 mb-1 text-center">챔피언 빌드 & 룬</h2>
                    <p class="text-xs text-slate-400 text-center mb-5">빌드를 보고 싶은 챔피언을 선택하세요.</p>
                    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mb-5">
                        <div id="cs-tabs" class="flex flex-wrap justify-center gap-1.5">${tabs}</div>
                        <input id="cs-search" type="text" autocomplete="off" value="${escHtml(champSelectQuery)}" placeholder="챔피언 검색 (예: 아트, ㅇㅌㄹㅅ)"
                            class="w-full sm:w-64 py-2 px-4 text-sm text-slate-900 font-bold bg-white rounded-xl outline-none border-2 border-amber-400/60 focus:ring-4 focus:ring-yellow-400 placeholder:font-normal placeholder:text-slate-400">
                    </div>
                    <div id="cs-grid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2"></div>
                </div>`;

            const drawGrid = () => {
                const list = filterChampNames(champSelectQuery, champSelectLine);
                const grid = document.getElementById('cs-grid');
                grid.innerHTML = list.length ? list.map(name => `
                    <button type="button" data-cs-name="${escHtml(name)}" class="side-chip group flex flex-col items-center gap-1 p-1.5 rounded-xl border border-transparent hover:border-amber-400 hover:bg-slate-800/80" title="${escHtml(name)}">
                        <img src="${getChampImgUrl(name)}" alt="${escHtml(name)}" loading="lazy" class="w-full aspect-square rounded-lg object-cover border border-slate-700 bg-slate-800 group-hover:border-amber-400">
                        <span class="text-[11px] font-bold text-slate-200 truncate w-full text-center">${escHtml(name)}</span>
                    </button>`).join('')
                    : `<p class="col-span-full text-center text-sm text-slate-500 py-8">${champSelectLine === 'all' ? '검색 결과가 없어요.' : '이 라인에 해당하는 챔피언이 없거나, 아직 데이터가 모이는 중이에요.'}</p>`;
            };
            drawGrid();

            document.getElementById('cs-tabs').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-cs-line]');
                if (!btn) return;
                champSelectLine = btn.dataset.csLine;
                document.querySelectorAll('#cs-tabs [data-cs-line]').forEach(b => {
                    const on = b === btn;
                    b.classList.toggle('bg-amber-500', on); b.classList.toggle('text-slate-950', on);
                    b.classList.toggle('bg-slate-800', !on); b.classList.toggle('text-white', !on);
                    b.classList.toggle('hover:bg-slate-700', !on);
                });
                drawGrid();
            });
            document.getElementById('cs-search').addEventListener('input', (e) => {
                champSelectQuery = e.target.value;
                drawGrid();
            });
            document.getElementById('cs-grid').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-cs-name]');
                if (btn) openChampPage(btn.dataset.csName);
            });
        }

        // ───────────── 챔피언 상세페이지 ─────────────
        window.openChampPage = function(name, role, pushHistory = true) {
            const data = window.CHAMP_DATA;
            const champ = data && data.champs ? data.champs[name] : null;
            if (champ) {
                const roles = champ.roles;
                if (!role || !roles[role]) role = Object.keys(roles).sort((x, y) => roles[y].games - roles[x].games)[0];
            }
            if (champ) setSideChamp(name, role);
            renderChampPage(name, role);
            switchToDetailView('champ', `${name}|${role || ''}`, pushHistory);
        };

        function statBar(pick) {
            const n = Math.max(0, Math.min(100, parseFloat(pick) || 0));
            return `<div class="h-1.5 rounded-full bg-slate-700 overflow-hidden"><div class="h-full bg-amber-400" style="width:${n}%"></div></div>`;
        }

        function statRow(iconHtml, title, o) {
            return `
                <div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-800/80 border border-slate-700">
                    ${iconHtml}
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-2 mb-1">
                            <span class="text-sm font-bold text-white truncate">${title}</span>
                            <span class="text-xs font-black ${wrColor(o.winRate)} flex-shrink-0">${o.winRate}</span>
                        </div>
                        ${statBar(o.pick)}
                        <div class="text-[10px] text-slate-500 mt-1">픽 ${o.pick}${o.games != null ? ` · ${Number(o.games).toLocaleString()}판` : ''}</div>
                    </div>
                </div>`;
        }

        // 1·2·3코어 빌드 순서
        function renderCoreBuild(cores) {
            const arrow = `<div class="hidden sm:flex items-center justify-center text-amber-400 font-black text-xl">›</div>`;
            const col = (opts, k) => {
                const main = opts[0];
                const alts = opts.slice(1);
                return `
                    <div class="flex-1 min-w-0 bg-slate-800/80 border border-slate-700 rounded-2xl p-3">
                        <div class="text-[11px] font-black text-amber-400 mb-2">${k}코어</div>
                        <div class="flex items-center gap-2.5 mb-2">
                            ${iconImg(getItemImgUrl(main.id), main.name, 'w-12 h-12', 'border-amber-400/70')}
                            <div class="min-w-0">
                                <div class="text-sm font-black text-white leading-tight">${escHtml(main.name)}</div>
                                <div class="text-[11px] text-slate-400 mt-0.5">픽 ${main.pick} · 승률 <b class="${wrColor(main.winRate)}">${main.winRate}</b></div>
                            </div>
                        </div>
                        ${alts.length ? `<div class="border-t border-slate-700 pt-2 space-y-1">
                            <div class="text-[10px] text-slate-500">다른 선택</div>
                            ${alts.map(a => `
                                <div class="flex items-center gap-2">
                                    ${iconImg(getItemImgUrl(a.id), a.name, 'w-6 h-6')}
                                    <span class="text-[11px] text-slate-300 truncate flex-1 min-w-0">${escHtml(a.name)}</span>
                                    <span class="text-[10px] text-slate-500 flex-shrink-0">${a.pick}</span>
                                </div>`).join('')}
                        </div>` : ''}
                    </div>`;
            };
            const parts = [];
            cores.forEach((opts, i) => { if (i) parts.push(arrow); parts.push(col(opts, i + 1)); });
            return `<div class="flex flex-col sm:flex-row gap-2 sm:gap-1">${parts.join('')}</div>`;
        }

        // 인게임 룬 화면처럼 그리기: 고른 룬은 밝게, 나머지는 흐리게
        function renderRunePage(page, tree) {
            const base = 'https://ddragon.leagueoflegends.com/cdn/img/';
            const styleOf = (id) => (tree.styles || []).find(st => st.id === id);
            const prim = styleOf(page.primary.style);
            const sub = styleOf(page.sub.style);
            if (!prim || !sub) return noDataText('룬 정보를 불러오지 못했어요.');
            const chosen = new Set([...page.primary.perks, ...page.sub.perks]);
            const runeIcon = (r, big) => {
                const on = chosen.has(r.id);
                const size = big ? 'w-11 h-11' : 'w-8 h-8';
                return `<img src="${base}${r.icon}" alt="${escHtml(r.name)}" title="${escHtml(r.name)}" onerror="this.style.visibility='hidden'"
                    class="${size} rounded-full flex-shrink-0 ${on ? 'ring-2 ring-amber-400 bg-slate-900' : 'opacity-25 grayscale'}">`;
            };
            const header = (st) => `
                <div class="flex items-center gap-2 mb-3">
                    <img src="${base}${st.icon}" alt="" class="w-6 h-6" onerror="this.style.visibility='hidden'">
                    <span class="text-sm font-black text-white">${escHtml(st.name)}</span>
                </div>`;
            const rows = (slots, bigFirst) => slots.map((row, i) => `
                <div class="flex items-center justify-center gap-2 ${i === 0 && bigFirst ? 'pb-2 mb-1 border-b border-slate-700' : ''}">
                    ${row.map(r => runeIcon(r, i === 0 && bigFirst)).join('')}
                </div>`).join('');
            const chosenNames = (st, perks) => perks.map(id => {
                for (const row of st.slots) { const r = row.find(x => x.id === id); if (r) return r.name; }
                return '';
            }).filter(Boolean);

            const shards = tree.shards || {};
            const shardRows = (tree.shardRows || []).map((row, i) => `
                <div class="flex items-center justify-center gap-2">
                    ${row.map(id => {
                        const sh = shards[String(id)] || { name: id, icon: '' };
                        const on = page.shards[i] === Number(id);
                        return `<img src="${base}${sh.icon}" alt="${escHtml(sh.name)}" title="${escHtml(sh.name)}" onerror="this.style.visibility='hidden'"
                            class="w-6 h-6 rounded-full p-0.5 ${on ? 'ring-2 ring-amber-400 bg-slate-900' : 'opacity-25 grayscale'}">`;
                    }).join('')}
                </div>`).join('');

            const names = [...chosenNames(prim, page.primary.perks), ...chosenNames(sub, page.sub.perks)];
            const shardNames = page.shards.map(id => (shards[String(id)] || {}).name).filter(Boolean);
            return `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-3 space-y-2">${header(prim)}${rows(prim.slots, true)}</div>
                    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-3 flex flex-col">
                        ${header(sub)}
                        <div class="flex-1 flex flex-col justify-center gap-2">${rows(sub.slots.slice(1), false)}</div>
                    </div>
                    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-3 flex flex-col">
                        <div class="text-sm font-black text-white mb-3">능력치 파편</div>
                        <div class="flex-1 flex flex-col justify-center gap-2">${shardRows}</div>
                    </div>
                </div>
                <p class="text-[11px] text-slate-400 mt-2 leading-relaxed">
                    <b class="text-slate-200">${names.map(escHtml).join(' · ')}</b>${shardNames.length ? ` / 파편: ${shardNames.map(escHtml).join(', ')}` : ''}
                </p>`;
        }

        function renderChampPage(name, role) {
            const data = window.CHAMP_DATA;
            const champ = data && data.champs ? data.champs[name] : null;
            const box = (inner) => `<div class="bg-slate-900/90 rounded-3xl p-6 sm:p-8 border border-amber-500/40 shadow-xl max-w-4xl mx-auto">${inner}</div>`;
            if (!champ || !role) {
                detailDynamicContent.innerHTML = box(`
                    <div class="flex flex-col items-center gap-3 text-center">
                        ${iconImg(getChampImgUrl(name), name, 'w-16 h-16')}
                        <h2 class="text-2xl font-black text-yellow-300">${escHtml(name)}</h2>
                        ${noDataText('이번 패치 표본이 부족해서 아직 상세 정보를 보여줄 수 없어요. 데이터가 쌓이면 나타나요.')}
                    </div>`);
                return;
            }
            const r = champ.roles[role];
            const meta = data.meta || {};
            const runeBase = 'https://ddragon.leagueoflegends.com/cdn/img/';
            const roleTabs = Object.keys(champ.roles).map(k => `
                <button type="button" onclick="openChampPage('${escJs(name)}', '${k}', false)" class="px-3 py-1.5 rounded-xl font-bold text-xs cursor-pointer ${k === role ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-white hover:bg-slate-700'}">${LINE_NAMES[k]}</button>`).join('');
            const statBox = (label, value, cls = 'text-white') => `
                <div class="bg-slate-800/80 border border-slate-700 rounded-2xl px-3 py-2 text-center">
                    <div class="text-[10px] text-slate-500">${label}</div>
                    <div class="text-base font-black ${cls}">${value}</div>
                </div>`;
            const section = (title, inner, sub = '') => `
                <div class="mb-6">
                    <div class="flex items-end justify-between mb-2">
                        <h3 class="text-base font-black text-yellow-300">${title}</h3>
                        <span class="text-[10px] text-slate-500">${sub}</span>
                    </div>
                    ${inner}
                </div>`;

            const items = (r.items || []).map(it => statRow(iconImg(getItemImgUrl(it.id), it.name, 'w-10 h-10'), escHtml(it.name), it)).join('');
            const boots = (r.bootsList || (r.boots ? [r.boots] : [])).map(it => statRow(iconImg(getItemImgUrl(it.id), it.name, 'w-10 h-10'), escHtml(it.name), it)).join('');
            const keystones = (r.keystones || (r.keystone ? [r.keystone] : [])).map(k => statRow(iconImg(runeBase + k.icon, k.name, 'w-10 h-10', 'rounded-full'), escHtml(k.name), k)).join('');
            const secondaries = (r.secondaries || []).map(k => statRow(iconImg(runeBase + k.icon, k.name, 'w-10 h-10', 'rounded-full border-0'), `보조 ${escHtml(k.name)}`, k)).join('');
            const spells = (r.spellsList || (r.spells ? [r.spells] : [])).map(sp => statRow(
                `<div class="flex gap-1 flex-shrink-0">${sp.list.map(x => iconImg(`https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/spell/${x.id}.png`, x.name, 'w-9 h-9')).join('')}</div>`,
                sp.list.map(x => escHtml(x.name)).join(' + '), sp)).join('');

            const oppBtn = (o) => `
                <button type="button" onclick="openMatchupFromSide('${escJs(name)}', '${escJs(o.name)}')" class="side-chip flex items-center gap-2 w-full p-2 rounded-xl border border-slate-700 bg-slate-800/80 text-left">
                    ${iconImg(champImg(o.name, o.id), o.name, 'w-9 h-9')}
                    <span class="text-sm font-bold text-white truncate flex-1 min-w-0">${escHtml(o.name)}</span>
                    <span class="text-right flex-shrink-0">
                        <span class="block text-sm font-black ${wrColor(o.winRate)}">${o.winRate}</span>
                        <span class="block text-[10px] text-slate-500">${Number(o.games).toLocaleString()}판</span>
                    </span>
                </button>`;
            // 승률 50% 미만은 어려운 상대, 50% 초과는 쉬운 상대 (각각 최대 3명)
            const vsAll = r.vs || [];
            const hardList = vsAll.length
                ? vsAll.filter(o => parseFloat(o.winRate) < 50).sort((a, b) => parseFloat(a.winRate) - parseFloat(b.winRate) || b.games - a.games).slice(0, 3)
                : (r.hard || []).filter(o => parseFloat(o.winRate) < 50);
            const easyList = vsAll.length
                ? vsAll.filter(o => parseFloat(o.winRate) > 50).sort((a, b) => parseFloat(b.winRate) - parseFloat(a.winRate) || b.games - a.games).slice(0, 3)
                : (r.easy || []).filter(o => parseFloat(o.winRate) > 50);

            detailDynamicContent.innerHTML = box(`
                <div class="flex flex-col sm:flex-row sm:items-center gap-4 mb-6">
                    ${iconImg(champImg(name, champ.id), name, 'w-20 h-20', 'rounded-2xl border-2 border-amber-400')}
                    <div class="flex-1 min-w-0">
                        <h2 class="text-3xl font-black text-white mb-2">${escHtml(name)}</h2>
                        <div class="flex flex-wrap gap-1.5">${roleTabs}</div>
                    </div>
                    <button type="button" onclick="selectDraftChamp1('${escJs(name)}', 'mine'); showMainView(true);" class="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-sm rounded-xl cursor-pointer shadow self-start sm:self-center">내 챔피언으로 상성 검색</button>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
                    ${statBox('승률', r.winRate, wrColor(r.winRate))}
                    ${statBox('픽률', r.pickRate)}
                    ${statBox('밴률', r.banRate)}
                    ${statBox('표본', `${Number(r.games).toLocaleString()}판`)}
                </div>
                <p class="text-[10px] text-slate-500 mb-6">${meta.patch ? `패치 ${escHtml(displayPatch(meta.patch))} · 한국 서버 ${escHtml(meta.tierLabel || '')} 솔로랭크 ${LINE_NAMES[role]} 기준` : ''}</p>

                ${(r.cores || []).length
                    ? section('핵심 아이템 빌드 순서', renderCoreBuild(r.cores), '구매 순서 기준 · 코어별 가장 많이 산 아이템')
                    : section('핵심 아이템', items ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${items}</div>` : noDataText('표본 부족'), '많이 가는 순서 · 막대는 픽률')}
                ${(r.runePages || []).length && data.runeTree
                    ? section('추천 룬', `${r.runePages.length > 1 ? `<div id="rune-tabs" class="flex gap-1.5 mb-3">${r.runePages.map((pg, i) => `
                        <button type="button" data-rune-idx="${i}" class="px-3 py-1 rounded-lg text-xs font-bold cursor-pointer ${i === 0 ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-white hover:bg-slate-700'}">${i + 1}순위 · 픽 ${pg.pick} · 승률 ${pg.winRate}</button>`).join('')}</div>` : ''}
                        <div id="rune-page-box">${renderRunePage(r.runePages[0], data.runeTree)}</div>`,
                        `가장 많이 쓰는 룬 · 픽 ${r.runePages[0].pick} · 승률 ${r.runePages[0].winRate}`)
                    : section('룬', (keystones || secondaries) ? `<div class="space-y-2">${keystones}${secondaries}</div>` : noDataText('표본 부족'))}

            const m = String(p || '').match(/^(\d+)\.(\d+)/);

            return `${major < 20 ? major + 10 : major}.${m[2]}`;

            card.addEventListener('click', (e) => {
                if (e.target.closest('button, a, input')) return;
                go();

                            <img src="${imgUrl}" alt="${item.name}" class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl object-cover border border-slate-600 bg-slate-900 flex-shrink-0">
                            <div class="min-w-0">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="font-black text-sm sm:text-base text-white whitespace-nowrap">${item.name}</span>
                                    <span class="text-[10px] px-1.5 py-0.5 rounded font-bold whitespace-nowrap ${tierClass}">${item.tier}</span>
                                </div>
                                <span class="text-[11px] sm:text-xs text-slate-400 whitespace-nowrap">픽 ${item.pickRate} · 밴 ${item.banRate}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 sm:gap-4 text-right flex-shrink-0">
                            <div>
                                <span class="text-sm sm:text-base font-black text-emerald-400 block whitespace-nowrap">${item.winRate}</span>
                                <span class="text-[10px] sm:text-[11px] text-slate-400">승률</span>
                            </div>
                            <button type="button" onclick="openMatchupModal('${item.name}')" class="px-2.5 sm:px-3.5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs rounded-xl cursor-pointer shadow transition-all whitespace-nowrap">
                                상성 ➔
                            </button>
                        </div>
                    </div>`;
                }).join('');
            }

            drawList('top');

            const tabButtons = document.querySelectorAll('#ranking-tabs button');
            tabButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabButtons.forEach(b => {
                        b.classList.remove('bg-amber-500', 'text-slate-950');
                        b.classList.add('bg-slate-800', 'text-white');
                    });
                    e.currentTarget.classList.remove('bg-slate-800', 'text-white');
                    e.currentTarget.classList.add('bg-amber-500', 'text-slate-950');

                    const selectedLine = e.currentTarget.dataset.line;
                    drawList(selectedLine);
                });
            });

            switchToDetailView('ranking', true);
        }

        window.openMatchupModal = function(champName) {
            showAlertModal(`
                <div class="text-center py-2">
                    <div class="flex items-center justify-center gap-3 mb-4">
                        <img src="${getChampImgUrl(champName)}" alt="${champName}" class="w-14 h-14 rounded-2xl object-cover border-2 border-amber-400 bg-slate-900 shadow-md">
                        <div class="text-left">
                            <h3 id="modal-title" class="text-xl font-black text-yellow-300">${champName}</h3>
                            <p class="text-xs text-slate-300">상대할 챔피언을 검색하거나 선택하세요</p>
                        </div>
                    </div>

                    <div class="relative w-full mb-3">
                        <input
                            id="modal-opp-input"
                            type="text"
                            autocomplete="off"
                            placeholder="상대 챔피언 입력 (예: 가렌, 제드)"
                            class="w-full py-3 px-4 text-center text-slate-900 font-bold text-sm bg-white rounded-xl outline-none focus:ring-4 focus:ring-yellow-400 shadow border-2 border-amber-400/60"
                        />
                        <div id="modal-opp-suggestions" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-amber-500/40 rounded-xl shadow-2xl max-h-56 overflow-y-auto z-50 hidden p-1.5 space-y-1 text-left"></div>
                    </div>
                    <p class="text-[11px] text-slate-400">이름을 치면 아래에 초상화 목록이 나타납니다.</p>
                </div>
            `);

            const modalOppInput = document.getElementById('modal-opp-input');
            const modalOppSuggestions = document.getElementById('modal-opp-suggestions');

            if (modalOppInput && modalOppSuggestions) {
                setupUniversalAutocomplete(modalOppInput, modalOppSuggestions, (selectedOppName) => {
                    closeAlertModal();
                    runSearch(`${champName} vs ${selectedOppName}`, true);
                });

                modalOppInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const oppVal = modalOppInput.value.trim();
                        const validOpp = getValidChampName(oppVal);
                        if (validOpp) {
                            closeAlertModal();
                            runSearch(`${champName} vs ${validOpp}`, true);
                        }
                    }
                });
                modalOppInput.focus();
            }
        };

        // 메인 화면 양옆 카드 4개를 상세페이지 상단으로 옮기거나 다시 제자리로 돌려놓음
        const SIDE_CARD_HOME = [
            ['card-popular', 'side-left'], ['card-op', 'side-left'],
            ['card-build', 'side-right'], ['card-patch', 'side-right'],
        ];
        function placeSideCards(toDetail) {
            const zone = document.getElementById('extension-zone');
            SIDE_CARD_HOME.forEach(([cardId, homeId]) => {
                const card = document.getElementById(cardId);
                if (!card) return;
                (toDetail ? zone : document.getElementById(homeId)).appendChild(card);
            });
            requestAnimationFrame(syncBuildCardHeight);
        }

        function switchToDetailView(type, subType, pushHistory = true) {
            if (typeof subType === 'boolean') { pushHistory = subType; subType = type; }
            mainView.classList.add('hidden'); mainView.classList.remove('grid');
            detailView.classList.remove('hidden'); detailView.classList.add('flex');
            placeSideCards(true);
            searchSuggestions1.classList.add('hidden'); searchSuggestions2.classList.add('hidden');
            if (pushHistory) history.pushState({ view: 'detail', type, subType }, '', '');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showMainView(pushHistory = true) {
            detailView.classList.add('hidden'); detailView.classList.remove('flex');
            placeSideCards(false);
            mainView.classList.remove('hidden'); mainView.classList.add('grid');
            searchInput1.value = ''; searchInput2.value = '';
            searchSuggestions1.classList.add('hidden'); searchSuggestions2.classList.add('hidden');
            if (pushHistory) history.pushState({ view: 'main' }, '', '');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.view === 'detail') {
                if (e.state.type === 'search') runSearch(e.state.subType, false);
                else if (e.state.type === 'champ') {
                    const [n, r] = String(e.state.subType || '').split('|');
                    openChampPage(n, r || null, false);
                }
                else renderPage(e.state.type, false);
            } else {
                showMainView(false);
            }
        });

        backToHomeBtn.addEventListener('click', (e) => { e.preventDefault(); showMainView(true); });
        brandLogo.addEventListener('click', (e) => { e.preventDefault(); showMainView(true); });

        searchForm1.addEventListener('submit', e => {
            e.preventDefault();
            searchSuggestions1.classList.add('hidden');
            runSearch(searchInput1.value, true);
        });

        searchForm2.addEventListener('submit', e => {
            e.preventDefault();
            searchSuggestions2.classList.add('hidden');
            const val = searchInput2.value.trim();
            if (!val) return;

            const fourMatch = parseBottom4Matchup(val);
            if (fourMatch) {
                runBottom2v2Search(fourMatch.myAdc, fourMatch.mySup, fourMatch.oppAdc, fourMatch.oppSup, val, true);
            } else {
                runSearch(val, true);
            }
        });

        function showAlertModal(html) {
            if (modalContainer.classList.contains('hidden')) lastFocused = document.activeElement;
            modalContent.innerHTML = html;
            modalContainer.classList.remove('hidden'); modalContainer.classList.add('flex');
            document.body.style.overflow = 'hidden';
            const focusTarget = document.getElementById('modal-opp-input') || document.getElementById('modal-close');
            if (focusTarget) focusTarget.focus();
        }

        function closeAlertModal() {
            modalContainer.classList.add('hidden'); modalContainer.classList.remove('flex');
            document.body.style.overflow = '';
            if (lastFocused) lastFocused.focus();
        }

        document.addEventListener('click', e => {
            const queryEl = e.target.closest('[data-query]');
            if (queryEl) { e.stopPropagation(); closeAlertModal(); runSearch(queryEl.dataset.query, true); return; }

            const pageEl = e.target.closest('[data-page]');
            if (pageEl) { renderPage(pageEl.dataset.page, true); return; }

            if (e.target === modalContainer || e.target.closest('#modal-close')) closeAlertModal();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && !modalContainer.classList.contains('hidden')) closeAlertModal();
        });

        document.addEventListener('submit', async e => {
            if (e.target.id !== 'feedback-form') return;
            e.preventDefault();
            const form = e.target;
            const matchup = form.matchup.value.trim();
            const tip = form.tip.value.trim();
            if (!matchup || !tip) return;

            try {
                const body = new URLSearchParams({ matchup, tip, page: location.href });
                await fetch(SHEET_URL, { method: 'POST', body, mode: 'no-cors' });
                detailDynamicContent.innerHTML = `
                    <div class="bg-slate-900/95 rounded-3xl p-8 border border-amber-500/40 shadow-xl text-center max-w-xl mx-auto py-16">
                        <h2 class="text-2xl font-black text-yellow-300 mb-2">공략 제보가 완료되었습니다!</h2>
                        <button type="button" onclick="showMainView(true)" class="bg-amber-400 hover:bg-amber-500 text-slate-950 font-black px-6 py-3 rounded-2xl text-sm cursor-pointer shadow-lg">메인으로 돌아가기</button>
                    </div>
                `;
            } catch (err) {
                console.error('전송 실패:', err);
            }
        });
    </script>
</body>
</html>
